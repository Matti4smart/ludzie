<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludzie</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E9F1DA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A14" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<style>
:root{--bg:#E9F1DA;--surface:#FFFCF2;--ink:#1F2B22;--muted:#5F6B57;--line:#D6E0C2;--accent:#6C5CE7;--accent-ink:#fff;--warm:#E2725B;--danger:#C2413A;--fam:#E2725B;
--serif:"Figtree",system-ui,sans-serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111A14;--surface:#19241C;--ink:#E9EFE3;--muted:#93A08C;--line:#2A3A2E;--accent:#9C8FFF;--accent-ink:#14112E;--warm:#F08B74;--danger:#F07A72;--fam:#F08B74}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--st) + 12px) 16px 8px}
.top h1{font:600 28px/1.1 var(--serif);margin:0 0 10px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:8px 16px calc(var(--sb) + 150px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:16px 12px}
.face{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 6px 8px;text-align:center;min-width:0}
.grid .face:nth-child(4n+1){transform:rotate(-1.6deg)}.grid .face:nth-child(4n+2){transform:rotate(1.2deg)}.grid .face:nth-child(4n+3){transform:rotate(-.7deg)}.grid .face:nth-child(4n){transform:rotate(1.8deg)}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.strip .face{flex:none;width:106px}.strip .face:nth-child(odd){transform:rotate(-1.4deg)}.strip .face:nth-child(even){transform:rotate(1.2deg)}
.gcard{flex:none;width:156px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.gcard b{display:block;font:500 16px/1.2 var(--serif);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gcard small{color:var(--muted);font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 8px}.sec h3{font:600 19px var(--serif);margin:0}
.hd{display:flex;justify-content:space-between;align-items:baseline}.hd span{color:var(--muted);font-size:13px}
.face .ph{width:100%;aspect-ratio:1;border-radius:2px;background:var(--line);object-fit:cover;display:grid;place-items:center;font:600 30px var(--serif);color:var(--muted)}
.face b{display:block;font:500 15px/1.2 var(--serif);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row img,.row .ph{width:48px;height:48px;border-radius:30%;object-fit:cover;background:var(--line);flex:none;display:grid;place-items:center;font:600 18px var(--serif);color:var(--muted)}
.row .grow{flex:1;min-width:0}
.when{font-weight:700;color:var(--warm);font-size:14px;text-align:right}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav.tabs button{flex:1;border:0;background:none;height:60px;padding:0;font-size:11px;color:var(--muted)}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs span{display:block;font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(var(--sb) + 76px);z-index:7;height:56px;padding:0 22px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(20,40,40,.28)}
.sheet{position:fixed;top:0;left:0;right:0;bottom:calc(60px + var(--sb));z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(24px);opacity:0;transition:.18s ease}
.sheet.on{transform:none;opacity:1}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{max-width:640px;margin:0 auto;padding:calc(var(--st) + 10px) 16px 32px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{color:var(--danger)}
.btn.wide{width:100%;margin-top:10px}
.p-photo{width:min(280px,72vw);aspect-ratio:1;border-radius:30%;object-fit:cover;display:block;margin:4px auto 14px;background:var(--line)}
.p-name{font:600 34px/1.1 var(--serif);text-align:center;margin:0}
.p-sub{text-align:center;color:var(--muted);margin:6px 0 14px}
.acts{display:flex;gap:10px;justify-content:center;margin-bottom:18px}
.acts a{flex:1;max-width:160px;text-align:center;text-decoration:none;padding:12px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.acts a.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.hint{background:var(--surface);border-left:4px solid var(--warm);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-style:italic}
dl{margin:0;background:var(--surface);border-radius:14px;padding:4px 14px}
dl div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
dl div:last-child{border:0}
dt{color:var(--muted)}dd{margin:0;text-align:right}
h2{font:600 20px var(--serif);margin:26px 0 10px}
.tree{background:var(--surface);border-radius:14px;padding:14px 8px}
.gen{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;position:relative;padding:4px 0 16px}
.gen+.gen::before{content:"";position:absolute;top:-14px;left:50%;height:12px;border-left:2px solid var(--line)}
.gen-l{width:100%;text-align:center;font-size:12px;color:var(--muted);margin-bottom:-4px}
.node{background:none;border:0;padding:0;width:72px;text-align:center;font-size:12px;line-height:1.2}
.node img,.node .ph{width:56px;height:56px;border-radius:30%;object-fit:cover;background:var(--line);display:grid;place-items:center;margin:0 auto 4px;font:600 20px var(--serif);color:var(--muted)}
.node.me img,.node.me .ph{width:72px;height:72px;outline:3px solid var(--accent);outline-offset:2px}
.node.add .ph{border:2px dashed var(--line);background:none;font:400 26px var(--sans)}
.rel-list .row{padding:8px 0}
.x{border:0;background:none;color:var(--muted);font-size:20px;padding:4px 8px}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
label small{font-weight:400;color:var(--muted)}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
textarea.in{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick{display:flex;gap:14px;align-items:center}
.photo-pick .prev{width:110px;height:110px;border-radius:30%;object-fit:cover;background:var(--line);flex:none}
.photo-pick .btns{display:flex;flex-direction:column;gap:8px;flex:1}
.check{display:flex;gap:10px;align-items:center;margin-top:16px;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.crop-wrap{height:60vh;background:#000;border-radius:14px;overflow:hidden}
.crop-wrap img{display:block;max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw}
.busy{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-weight:600}
.pick-row{width:100%;border:0;background:none;text-align:left}
.pick-row.dis{opacity:.45}
.para{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:16px;padding:6px 6px 4px}.heart{color:var(--warm);font-size:14px;margin-top:-18px}
.stack{display:flex;flex:none}.stack img,.stack .ph{width:40px;height:40px;border-radius:30%;object-fit:cover;background:var(--line);margin-left:-12px;border:2px solid var(--surface);display:grid;place-items:center;font:600 15px var(--serif);color:var(--muted)}.stack>:first-child{margin-left:0}
.gpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.gadd{display:flex;gap:8px;margin-top:8px}.gadd .in{flex:1}
.os{position:relative;padding-left:4px}.os::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;border-left:2px solid var(--line)}
.os-dek{font:600 15px var(--serif);color:var(--accent);margin:12px 0 4px 72px}
.os-w{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px 0;text-align:left;position:relative}
.os-r{width:44px;font-weight:700;font-size:14px;color:var(--muted);text-align:right;flex:none}.os-k{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;margin:0 4px;z-index:1;border:2px solid var(--bg)}
.os-w img,.os-w .ph{width:46px;height:46px;border-radius:30%;object-fit:cover;flex:none;background:var(--line);display:grid;place-items:center;font:600 18px var(--serif);color:var(--muted)}
.os-w small{color:var(--muted)}.os-w.me b{color:var(--accent)}
.kolaz{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:10px 0}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 5px 7px;transform:rotate(var(--r));box-shadow:0 3px 10px rgba(60,40,20,.12);font:500 13px var(--serif);color:var(--ink)}
.kp img,.kp .ph{display:grid;place-items:center;object-fit:cover;background:var(--line);border-radius:2px;margin-bottom:4px;font:600 26px var(--serif);color:var(--muted)}
.kp b{display:block;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kp-xl img,.kp-xl .ph{width:150px;height:150px}.kp-l img,.kp-l .ph{width:104px;height:104px}.kp-m img,.kp-m .ph{width:76px;height:76px}.kp-s img,.kp-s .ph{width:58px;height:58px}
.kp-xl{z-index:2}.kp-xl b{font-size:16px}
.kim{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:16px;padding:14px}
.kim-p{text-align:center;width:78px;flex:none}.kim-p img,.kim-p .ph{width:70px;height:70px;border-radius:30%;object-fit:cover;background:var(--line);display:grid;place-items:center;margin:0 auto 4px;font:600 24px var(--serif);color:var(--muted)}
.kim-v{text-align:center;color:var(--muted);font-size:13px}.kim-v strong{display:block;font:600 24px/1.2 var(--serif);color:var(--accent);margin-top:4px}
.kim-droga{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}.kim-s{color:var(--muted)}.kim-n{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px}
.rn{display:inline-block;background:var(--line);color:var(--accent);font-weight:700;border-radius:6px;padding:0 5px;margin:0 1px;cursor:pointer}.rn small{font-size:10px;margin-left:2px;font-weight:400}
.rbox{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-top:8px}.rbox .chips{padding:8px 0 0}
.face,.node,.kp,.pw{position:relative}
.wst{position:absolute;top:2px;left:2px;width:26px;height:32px;z-index:3;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.node .wst{width:16px;height:20px;left:6px;top:-2px}.pw .wst{width:48px;height:58px;top:4px;left:calc(50% - min(140px,36vw) + 6px)}.kp .wst{width:22px;height:27px}
.gal{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;justify-content:center;scrollbar-width:none}
.gal button{flex:none;width:58px;height:58px;padding:0;border:2px solid transparent;border-radius:14px;overflow:hidden;background:var(--line)}
.gal button.on{border-color:var(--accent)}.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .gadd{border:2px dashed var(--line);background:none;color:var(--muted);font-size:24px}
.qb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + var(--sb) + 10px);z-index:40;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 14px;border-radius:999px;display:none;white-space:nowrap}
.qb.on{display:block}.qb.off{background:var(--danger)}
.today{background:var(--surface);border-radius:14px;padding:10px 14px;margin:6px 0 14px;border-left:4px solid var(--warm)}
/* ===== wygląd: Sieć więzi ===== */
.top h1{font:700 28px/1.1 var(--sans);letter-spacing:-.4px}
.grid .face,.strip .face{transform:none!important}
.face{border-radius:18px;padding:12px 6px 10px;border:1px solid var(--line)}
.face .ph,.face img.ph{width:78%;margin:0 auto;border-radius:50%!important;outline:3px solid var(--gc,var(--line));outline-offset:2px}
.face b{font:600 14px/1.2 var(--sans);margin-top:10px}
.gcard{border-radius:18px;border-left:4px solid var(--gc,var(--line))}
.gcard b{font:600 15px var(--sans)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fab{background:var(--ink);color:var(--bg);border-radius:999px;box-shadow:0 6px 18px rgba(31,43,34,.28)}
nav.tabs button.on{color:var(--ink)}
.p-photo{border-radius:50%}.p-name,.sec h3,h2{font-family:var(--sans);font-weight:700}
.siec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px;margin:4px 0 8px;position:relative}
.siec svg{display:block;width:100%;touch-action:none}
.siec .full{position:absolute;right:10px;top:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.sn{cursor:pointer;transition:opacity .2s}.sn text{font:600 10px var(--sans);fill:var(--ink)}.sh text{font:600 10px var(--sans)}
.leg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.leg button{flex:none;border:0;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;background:var(--lb);color:var(--lc)}
.leg button.on{outline:2px solid var(--lc)}
.ins{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){.sn{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="qb" id="qb"></div>
<nav class="tabs" id="tabs">
  <button data-v="ludzie" class="on"><span>☺</span>Ludzie</button>
  <button data-v="rodziny"><span>👪</span>Rodziny</button>
  <button data-v="grupy"><span>🏷</span>Grupy</button>
  <button data-v="daty"><span>🎂</span>Nadchodzące</button>
  <button data-v="ust"><span>⚙</span>Ustawienia</button>
</nav>
<button class="fab" id="fab">+ Dodaj osobę</button>

<script>
/* ========= stan i narzędzia ========= */
const S={osoby:[],relacje:[],q:'',grupa:'',sort:'az',view:'ludzie'};
let cfg=JSON.parse(localStorage.getItem('cfg')||'{}');
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
const byId=id=>S.osoby.find(o=>o.id===id);
const nazwa=o=>o?(o.imie+' '+o.nazwisko).trim():'?';
const ini=o=>h((o.imie||'?')[0]);
const wst=o=>o&&o.smierc?'<svg class="wst" viewBox="0 0 28 34" aria-label="zmarły"><path fill="#111" stroke="#fff" stroke-width="1.3" fill-rule="evenodd" d="M14 2.5c-4.6 0-6.4 3-5.4 6.6l2.6 6.4L5.6 30l3.6-.8 1.8 2.9 3-9.3 3 9.3 1.8-2.9 3.6.8-5.6-14.5 2.6-6.4c1-3.6-.8-6.6-5.4-6.6zm0 3.4c1.9 0 2.6 1.1 2.1 2.8L14 13.4l-2.1-4.7c-.5-1.7.2-2.8 2.1-2.8z"/></svg>':'';
const img=(o,cls='ph')=>o&&o.miniatura?`<img class="${cls}" src="${o.miniatura}" alt="">`:`<div class="ph">${o?ini(o):'+'}</div>`;
/* ===== liczby rosnące: [⟳N|RRRR-MM|s|k(|limit)] ===== */
const RTOK=/\[⟳(\d+)\|(\d{4})-(\d{2})\|([sk])(?:\|(\d+))?\]/g;
const syr=(y,m)=>m>=9?y:y-1;
function rWart(n,y,m,t){const d=new Date(),cy=d.getFullYear(),cm=d.getMonth()+1;return +n+(t==='s'?syr(cy,cm)-syr(+y,+m):cy-(+y))}
const rInfo=(n,y,m,t)=>`Wpisano ${n} w ${m}.${y}, rośnie co rok ${t==='s'?'od 1 września':'od 1 stycznia'}`;
const rosnTxt=s=>String(s||'').replace(RTOK,(_,n,y,m,t)=>rWart(n,y,m,t));
const rosnHtml=esc=>esc.replace(RTOK,(_,n,y,m,t)=>`<span class="rn" data-i="${rInfo(n,y,m,t)}">${rWart(n,y,m,t)}<small>⟳</small></span>`);
function rosnGr(raw){let abs=null;const txt=raw.replace(RTOK,(_,n,y,m,t,cap)=>{const v=rWart(n,y,m,t);if(cap&&v>+cap)abs=t==='s'?syr(+y,+m)+(+cap-n)+1:+y+(+cap-n);return v});
  if(abs!==null)return 'Absolwenci '+(raw.replace(RTOK,'').replace(/^\s*klasa\s*/i,'').trim()||'')+' ('+abs+')';return txt}
function rebase(s){const d=new Date(),ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return String(s||'').replace(RTOK,(all,n,y,m,t,cap)=>{const v=rWart(n,y,m,t);return cap&&v>+cap?all:`[⟳${v}|${ym}|${t}${cap?'|'+cap:''}]`})}
const nowyTok=(n,t,cap)=>{const d=new Date();return `[⟳${n}|${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}|${t}${cap?'|'+cap:''}]`};
document.addEventListener('click',e=>{const r=e.target.closest&&e.target.closest('.rn');if(r){e.stopPropagation();toast(r.dataset.i)}},true);
const grupyRaw=o=>[...new Set(String(o.grupy||'').split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean))];
const grupyOf=o=>[...new Set(grupyRaw(o).map(rosnGr))];
const rawDla=g=>{for(const o of S.osoby)for(const r of grupyRaw(o))if(rosnGr(r)===g)return rebase(r);return g};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function busy(on,t='Chwila…'){let b=$('.busy');if(on&&!b){b=document.createElement('div');b.className='busy';document.body.appendChild(b)}if(b){if(on)b.textContent=t;else b.remove()}}

/* ========= IndexedDB cache (offline) ========= */
const idb=(()=>{let db;const open=()=>db||(db=new Promise((r,j)=>{const q=indexedDB.open('ludzie',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}));
 const tx=async(m,f)=>{const d=await open();return new Promise((r,j)=>{const t=d.transaction('kv',m);const q=f(t.objectStore('kv'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)})};
 return{get:k=>tx('readonly',s=>s.get(k)).catch(()=>null),set:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>{})}})();
const zapiszCache=()=>idb.set('dane',{osoby:S.osoby,relacje:S.relacje});

/* ========= API ========= */
async function api(action,data={}){
  if(!cfg.url)throw new Error('Uzupełnij ustawienia połączenia');
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,action,...data})});
  const j=await r.json(); if(!j.ok){const e=new Error(j.error);e.server=true;throw e} return j;
}
/* ========= zapis w tle: kolejka (przetrwa zamknięcie aplikacji) ========= */
const Q={jobs:[],run:false};
const nid=()=>Math.random().toString(36).slice(2,10);
function qBadge(){const b=$('#qb');if(!b)return;const n=Q.jobs.length;b.classList.toggle('on',n>0);b.classList.toggle('off',n>0&&!navigator.onLine);
  b.textContent=!n?'':navigator.onLine?`⟳ Zapisuję w tle… (${n})`:`Brak sieci — zapiszę później (${n})`}
function wTle(action,data,opis){Q.jobs.push({jid:nid(),action,data,opis:opis||''});idb.set('kolejka',Q.jobs);qBadge();qRun()}
async function qRun(){if(Q.run)return;Q.run=true;let proba=0;
  while(Q.jobs.length){const job=Q.jobs[0];
    if(!navigator.onLine){await new Promise(r=>addEventListener('online',r,{once:true}));continue}
    try{const j=await api(job.action,{...job.data,jid:job.jid});proba=0;Q.jobs.shift();idb.set('kolejka',Q.jobs);poZapisieSerwera(job,j)}
    catch(e){if(e.server){Q.jobs.shift();idb.set('kolejka',Q.jobs);toast('Nie zapisano'+(job.opis?' ('+job.opis+')':'')+': '+e.message)}
      else{proba++;qBadge();await new Promise(r=>setTimeout(r,Math.min(30000,2000*proba)))}}
    qBadge()}
  Q.run=false;qBadge()}
const POLA_SERWERA=['foto','zdjecia','google','gsnap','utworzono'];
function poZapisieSerwera(job,j){
  if(j.uwaga)toast(j.uwaga);else if(job.action==='zapisz'&&job.data.eksport)toast('Dodano do Google Kontaktów');
  const s=j.osoba;if(!s)return;const o=byId(s.id);if(!o)return;
  if(job.data.fl){idb.get('fl:'+job.data.fl).then(b=>{if(b&&s.foto)idb.set('f:'+s.foto,b)});if(o._fl===job.data.fl)delete o._fl}
  const dalej=Q.jobs.some(x=>x.data&&((x.data.osoba&&x.data.osoba.id===s.id)||x.data.id===s.id));
  if(dalej)POLA_SERWERA.forEach(k=>o[k]=s[k]);else{const fl=o._fl;Object.assign(o,s);if(fl)o._fl=fl}
  zapiszCache();if(!stack.length)render()}

/* ========= daty ========= */
function parseDM(s){const t=String(s||'').trim();if(/^\d{4}$/.test(t))return{d:null,m:null,y:+t};const m=String(s||'').trim().match(/^(\d{1,2})[.\-/](\d{1,2})(?:[.\-/](\d{4}))?$/);return m?{d:+m[1],m:+m[2],y:m[3]?+m[3]:null}:null}
function dniDo(dm){const t=new Date();t.setHours(0,0,0,0);let n=new Date(t.getFullYear(),dm.m-1,dm.d);if(n<t)n=new Date(t.getFullYear()+1,dm.m-1,dm.d);return Math.round((n-t)/864e5)}
const kiedyTxt=d=>d===0?'dziś':d===1?'jutro':'za '+d+' dni';
function nadchodzace(limit=60){const out=[];S.osoby.filter(o=>!o.smierc).forEach(o=>{[['urodziny','Urodziny'],['imieniny','Imieniny']].forEach(([k,l])=>{const dm=parseDM(o[k]);if(!dm||!dm.d)return;const d=dniDo(dm);if(d<=limit){let extra='';if(k==='urodziny'&&dm.y)extra=` (kończy ${new Date(Date.now()+d*864e5).getFullYear()-dm.y})`;out.push({o,l,d,extra})}})});return out.sort((a,b)=>a.d-b.d)}

const stack=[];
function openSheet(html){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="sheet-in">${html}</div>`;document.body.appendChild(d);stack.push(d);history.pushState({s:stack.length},'');requestAnimationFrame(()=>d.classList.add('on'));return d}
const closeSheet=()=>history.back();
addEventListener('popstate',e=>{const n=(e.state&&e.state.s)||0;while(stack.length>n){const d=stack.pop();d.classList.remove('on');setTimeout(()=>d.remove(),180)}});

const PAL=['#1F9E89','#6C5CE7','#D9902F','#2F7FD8','#D6588F','#4C9A2A','#8E6CC9','#B5651D'];
const kolorGr=g=>{let x=7;for(const c of g)x=(x*31+c.charCodeAt(0))>>>0;return PAL[x%PAL.length]};
const tlo=c=>c+'22';
const kolorOs=o=>{const g=grupyOf(o)[0];return g?kolorGr(g):(S.relacje.some(r=>r.a===o.id||r.b===o.id)?'var(--fam)':'var(--line)')};

let SIEC_CACHE={};
function modelSieci(maxN){
  const sig=maxN+'|'+S.osoby.map(o=>o.id+o.grupy).join()+'|'+S.relacje.map(r=>r.id).join()+'|'+(cfg.ja||'');
  if(SIEC_CACHE[maxN]&&SIEC_CACHE[maxN].sig===sig)return SIEC_CACHE[maxN];
  const deg=stopnie();let ppl=S.osoby.filter(o=>deg[o.id]||o.id===cfg.ja).sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0)).slice(0,maxN);
  if(cfg.ja&&byId(cfg.ja)&&!ppl.some(o=>o.id===cfg.ja))ppl.unshift(byId(cfg.ja));
  const ids=new Set(ppl.map(o=>o.id)),N=[],E=[],idx={};
  ppl.forEach(o=>{idx[o.id]=N.length;N.push({id:o.id,t:'p',o,ja:o.id===cfg.ja})});
  listaGrup().forEach(([g,m])=>{const w=m.filter(i=>ids.has(i));if(w.length<2)return;idx['g:'+g]=N.length;N.push({id:'g:'+g,t:'g',g,c:kolorGr(g)});w.forEach(i=>E.push({a:idx[i],b:idx['g:'+g],c:kolorGr(g),g,L:52}))});
  S.relacje.forEach(r=>{if(ids.has(r.a)&&ids.has(r.b))E.push({a:idx[r.a],b:idx[r.b],c:'var(--fam)',f:1,L:44})});
  const n=N.length;N.forEach((v,i)=>{const a=i*2.399,rr=30+Math.sqrt(i)*28;v.x=Math.cos(a)*rr;v.y=Math.sin(a)*rr});
  for(let it=0;it<320;it++){const k=1-it/320;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=N[i],B=N[j];let dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy+.01;const f=900/d2;dx*=f;dy*=f;A.x+=dx;A.y+=dy;B.x-=dx;B.y-=dy}
    E.forEach(e=>{const A=N[e.a],B=N[e.b],dx=B.x-A.x,dy=B.y-A.y,d=Math.sqrt(dx*dx+dy*dy)+.01,f=(d-e.L)/d*.08;A.x+=dx*f;A.y+=dy*f;B.x-=dx*f;B.y-=dy*f});
    N.forEach(v=>{v.x*=1-.012*k;v.y*=1-.012*k;if(v.ja){v.x=0;v.y=0}})}
  const W=maxN>60?620:340,H=maxN>60?760:250,pad=30;
  if(n){const x0=Math.min(...N.map(v=>v.x)),x1=Math.max(...N.map(v=>v.x)),y0=Math.min(...N.map(v=>v.y)),y1=Math.max(...N.map(v=>v.y));
    const k=Math.min((W-2*pad)/Math.max(x1-x0,1),(H-2*pad)/Math.max(y1-y0,1),1.8);
    N.forEach(v=>{v.x=W/2+(v.x-(x0+x1)/2)*k;v.y=H/2+(v.y-(y0+y1)/2)*k})}
  const m={N,E,sig,box:[0,0,W,H]};
  SIEC_CACHE[maxN]=m;return m}
function siecSvg(m,etyk){
  const R=v=>v.ja?22:16;
  return `<svg viewBox="${m.box.map(Math.round).join(' ')}" role="img" aria-label="Sieć powiązań między osobami"><defs>${m.N.filter(v=>v.t==='p'&&v.o.miniatura).map(v=>`<clipPath id="cp-${v.id}"><circle cx="${v.x.toFixed(1)}" cy="${v.y.toFixed(1)}" r="${R(v)}"/></clipPath>`).join('')}</defs>
   ${m.E.map(e=>{const A=m.N[e.a],B=m.N[e.b];return `<line class="se" data-eg="${e.f?'#rodzina':h(e.g)}" x1="${A.x.toFixed(1)}" y1="${A.y.toFixed(1)}" x2="${B.x.toFixed(1)}" y2="${B.y.toFixed(1)}" stroke="${e.c}" stroke-width="${e.f?2.4:1.6}" opacity="${e.f?.9:.55}"/>`}).join('')}
   ${m.N.map(v=>{const x=v.x.toFixed(1),y=v.y.toFixed(1);
     if(v.t==='g')return `<g class="sn sh" data-sg="${h(v.g)}" data-gs="${h(v.g)}"><circle cx="${x}" cy="${y}" r="7" fill="${v.c}"/>${etyk?`<text x="${x}" y="${(v.y+19).toFixed(1)}" text-anchor="middle" fill="${v.c}">${h(v.g)}</text>`:''}</g>`;
     const o=v.o,r=R(v),c=v.ja?'var(--ink)':kolorOs(o),gs=[...grupyOf(o),...(S.relacje.some(z=>z.a===o.id||z.b===o.id)?['#rodzina']:[])].map(h).join('|');
     return `<g class="sn" data-pid="${o.id}" data-gs="${gs}"><circle cx="${x}" cy="${y}" r="${r+2.5}" fill="var(--surface)" stroke="${c}" stroke-width="2.5"/>
       ${o.miniatura?`<image href="${o.miniatura}" x="${(v.x-r).toFixed(1)}" y="${(v.y-r).toFixed(1)}" width="${r*2}" height="${r*2}" clip-path="url(#cp-${o.id})" preserveAspectRatio="xMidYMid slice"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="${v.ja?'var(--ink)':tlo(c.startsWith('#')?c:'#E2725B')}"/><text x="${x}" y="${(v.y+4).toFixed(1)}" text-anchor="middle" style="font-size:${v.ja?13:12}px;fill:${v.ja?'var(--bg)':'var(--ink)'}">${v.ja&&!o.miniatura?'Ty':h((o.imie||'?')[0])}</text>`}
       ${o.smierc?`<path d="M${(v.x+r-6).toFixed(1)} ${(v.y-r-2).toFixed(1)}l3 0 1 4 1-4 3 0-3 9z" fill="#111" stroke="#fff" stroke-width=".8"/>`:''}
       ${etyk?`<text x="${x}" y="${(v.y+r+14).toFixed(1)}" text-anchor="middle">${h(o.imie)}</text>`:''}</g>`}).join('')}</svg>`}
function legenda(m){const gs=[...new Set(m.N.filter(v=>v.t==='g').map(v=>v.g))];const fam=m.E.some(e=>e.f);

function wglad(){const deg=stopnie(),top=S.osoby.filter(o=>deg[o.id]&&o.id!==cfg.ja).sort((a,b)=>deg[b.id]-deg[a.id])[0];if(!top)return'';

  const svg=d.querySelector('svg');svg.style.height='100%';let vb=m.box.slice();const set=()=>svg.setAttribute('viewBox',vb.join(' '));
  const pts=new Map();let d0=0,vb0=null,moved=false;
  svg.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});vb0=vb.slice();moved=false;if(pts.size===2){const[a,b]=[...pts.values()];d0=Math.hypot(a.x-b.x,a.y-b.y)}});
  svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p0=pts.get(e.pointerId),sc=vb[2]/svg.clientWidth;
    if(pts.size===1){const dx=(e.clientX-p0.x)*sc,dy=(e.clientY-p0.y)*sc;if(Math.abs(dx)+Math.abs(dy)>2/sc*sc)moved=true;vb[0]-=dx;vb[1]-=dy;p0.x=e.clientX;p0.y=e.clientY;set()}
    else{p0.x=e.clientX;p0.y=e.clientY;const[a,b]=[...pts.values()],dd=Math.hypot(a.x-b.x,a.y-b.y);if(d0){const f=d0/dd,cx=vb0[0]+vb0[2]/2,cy=vb0[1]+vb0[3]/2;vb=[cx-vb0[2]*f/2,cy-vb0[3]*f/2,vb0[2]*f,vb0[3]*f];set();moved=true}}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2){d0=0;vb0=vb.slice()}};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('click',e=>{if(moved){e.stopPropagation();moved=false}},true);

/* ========= rodzina ========= */
const relOf=(id,typ)=>S.relacje.filter(r=>r.typ===typ&&(r.a===id||r.b===id));
const rodzice=id=>S.relacje.filter(r=>r.typ==='rodzic'&&r.b===id).map(r=>r.a);
const dzieci=id=>S.relacje.filter(r=>r.typ==='rodzic'&&r.a===id).map(r=>r.b);
const partnerzy=id=>relOf(id,'malzonek').map(r=>r.a===id?r.b:r.a);
const rodzenstwo=id=>[...new Set([...relOf(id,'rodzenstwo').map(r=>r.a===id?r.b:r.a),...rodzice(id).flatMap(dzieci)])].filter(x=>x!==id);
const uniq=a=>[...new Set(a)];
function opisRelacji(r,id){const inny=byId(r.a===id?r.b:r.a);let t;
  if(r.typ==='rodzic')t=r.b===id?'rodzic':'dziecko';else if(r.typ==='malzonek')t='partner / małżonek';else t='rodzeństwo';return{inny,t}}

const node=(pid,cls='')=>{const o=byId(pid);return o?`<button class="node ${cls}" data-go="${pid}">${wst(o)}${img(o)}${h(o.imie)}</button>`:''};
function drzewo(id){
  const rp=rodzice(id),dz=uniq([...dzieci(id),...partnerzy(id).flatMap(dzieci)]);
  const dziadkowie=uniq(rp.flatMap(rodzice)),wnuki=uniq(dz.flatMap(dzieci));
  const add=(rel,label)=>`<button class="node add" data-add="${rel}"><div class="ph">+</div>${label}</button>`;
  const gen=(label,items)=>`<div class="gen"><div class="gen-l">${label}</div>${items}</div>`;
  let html='';
  if(dziadkowie.length)html+=gen('Dziadkowie',dziadkowie.map(x=>node(x)).join(''));
  html+=gen('Rodzice',rp.map(x=>node(x)).join('')+(rp.length<2?add('rodzic','rodzic'):''));
  html+=gen('Rodzeństwo i partner',rodzenstwo(id).map(x=>node(x)).join('')+node(id,'me')+partnerzy(id).map(x=>node(x)).join('')+add('rodzenstwo','rodzeństwo')+(partnerzy(id).length?'':add('malzonek','partner')));
  html+=gen('Dzieci',dz.map(x=>node(x)).join('')+add('dziecko','dziecko'));
  if(wnuki.length)html+=gen('Wnuki',wnuki.map(x=>node(x)).join(''));
  return `<div class="tree">${html}</div>`;
}

/* ========= powiązania z automatycznym uzupełnianiem rodziny ========= */
const RELN={rodzic:'Rodzic',dziecko:'Dziecko',malzonek:'Partner / małżonek',rodzenstwo:'Rodzeństwo'};
const relDef=(rel,id,inny)=>rel==='rodzic'?{a:inny,typ:'rodzic',b:id}:rel==='dziecko'?{a:id,typ:'rodzic',b:inny}:{a:id,typ:rel,b:inny};
const jest=r=>S.relacje.some(x=>x.typ===r.typ&&((x.a===r.a&&x.b===r.b)||(r.typ!=='rodzic'&&x.a===r.b&&x.b===r.a)));
function uzupelnienia(r){const out=[];
  if(r.typ==='rodzic')partnerzy(r.a).forEach(q=>out.push({a:q,typ:'rodzic',b:r.b}));
  if(r.typ==='malzonek'){dzieci(r.a).forEach(c=>out.push({a:r.b,typ:'rodzic',b:c}));dzieci(r.b).forEach(c=>out.push({a:r.a,typ:'rodzic',b:c}))}
  if(r.typ==='rodzenstwo'){const pa=rodzice(r.a),pb=rodzice(r.b);if(pa.length&&!pb.length)pa.forEach(x=>out.push({a:x,typ:'rodzic',b:r.b}));if(pb.length&&!pa.length)pb.forEach(x=>out.push({a:x,typ:'rodzic',b:r.a}))}
  return out}
async function dodajRelacje(lista){const q=[...lista];let auto=0,n=0;
  while(q.length&&n++<200){const r=q.shift();
    if(r.a===r.b||jest(r)||!byId(r.a)||!byId(r.b))continue;
    if(r.auto&&r.typ==='rodzic'&&rodzice(r.b).length>=2)continue;
    const rel={id:nid(),a:r.a,typ:r.typ,b:r.b};S.relacje.push(rel);wTle('relacjaDodaj',rel,'powiązanie');if(r.auto)auto++;
    uzupelnienia(r).forEach(x=>q.push({...x,auto:true}))}
  zapiszCache();return auto}

}

function skladowa(id){const seen=new Set([id]),q=[id];while(q.length){const x=q.shift();S.relacje.forEach(r=>{const y=r.a===x?r.b:r.b===x?r.a:null;if(y&&!seen.has(y)&&byId(y)){seen.add(y);q.push(y)}})}return[...seen]}
function pokolenia(ids){const g={[ids[0]]:0},q=[ids[0]];while(q.length){const x=q.shift();S.relacje.forEach(r=>{let y,d;if(r.a===x){y=r.b;d=r.typ==='rodzic'?1:0}else if(r.b===x){y=r.a;d=r.typ==='rodzic'?-1:0}else return;if(y in g||!byId(y))return;g[y]=g[x]+d;q.push(y)})}
  const m=Math.min(...Object.values(g));const rows=[];Object.entries(g).forEach(([k,v])=>(rows[v-m]=rows[v-m]||[]).push(k));return rows.filter(Boolean)}
function uloz(row){const used=new Set(),out=[];const key=x=>rodzice(x).slice().sort().join()||'~'+x;
  row.slice().sort((a,b)=>key(a).localeCompare(key(b))||nazwa(byId(a)).localeCompare(nazwa(byId(b)),'pl')).forEach(x=>{if(used.has(x))return;used.add(x);const pp=partnerzy(x).filter(p=>row.includes(p)&&!used.has(p));pp.forEach(p=>used.add(p));out.push([x,...pp])});return out}
function rodziny(){const done=new Set(),out=[];S.osoby.forEach(o=>{if(done.has(o.id))return;const ids=skladowa(o.id);ids.forEach(i=>done.add(i));if(ids.length>1)out.push(ids)});return out}
function nazwaRodziny(ids){const c={};ids.forEach(i=>{const n=byId(i).nazwisko;if(n)c[n]=(c[n]||0)+1});const t=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return 'Rodzina '+(t?t[0]:byId(ids[0]).imie)}
/* ========= rodzina: drzewo, oś czasu, kolaż, "kim jest dla mnie" ========= */
const kob=o=>{const n=norm((o&&o.imie||'').split(' ')[0]);return /a$/.test(n)&&!['kuba','barnaba','kosma','bonawentura','jarema'].includes(n)};
const rokUr=o=>{const dm=parseDM(o&&o.urodziny);return dm&&dm.y?dm.y:null};
function sasiedzi(x){const out=[];S.relacje.forEach(r=>{
  if(r.typ==='rodzic'){if(r.b===x)out.push([r.a,'P']);else if(r.a===x)out.push([r.b,'C'])}
  else if(r.a===x||r.b===x)out.push([r.a===x?r.b:r.a,r.typ==='malzonek'?'S':'R'])});return out.filter(([y])=>byId(y))}
function sciezka(a,b){const prev={[a]:null},q=[a];while(q.length){const x=q.shift();if(x===b)break;for(const[y,t]of sasiedzi(x))if(!(y in prev)){prev[y]=[x,t];q.push(y)}}
  if(!(b in prev))return null;const kroki=[];let c=b;while(prev[c]){kroki.unshift({id:c,t:prev[c][1]});c=prev[c][0]}return kroki}
const KROK={P:['ojciec','matka'],C:['syn','córka'],S:['mąż','żona'],R:['brat','siostra']};
const NAZWY={P:['ojciec','matka'],C:['syn','córka'],S:['mąż','żona'],PC:['brat','siostra'],PP:['dziadek','babcia'],CC:['wnuk','wnuczka'],
  PPP:['pradziadek','prababcia'],CCC:['prawnuk','prawnuczka'],PPC:['wujek','ciocia'],PPCC:['kuzyn','kuzynka'],SP:['teść','teściowa'],CS:['zięć','synowa'],
  SPC:['szwagier','szwagierka'],PCS:['szwagier','szwagierka'],SPCS:['szwagier','szwagierka'],PS:['ojczym','macocha'],SC:['pasierb','pasierbica'],
  CSP:['swat','swatka'],PPCS:['wujek (przez małżeństwo)','ciocia (przez małżeństwo)'],SPP:['dziadek współmałżonka','babcia współmałżonka'],
  CCS:['mąż wnuczki','żona wnuka'],PPPC:['brat dziadków','siostra dziadków'],SPPC:['wujek współmałżonka','ciocia współmałżonka']};
function kimJest(a,b){if(a===b)return{nazwa:'to ta sama osoba',kroki:[]};const k=sciezka(a,b);if(!k)return null;
  const wz=k.map(x=>x.t==='R'?'PC':x.t).join('');const f=kob(byId(b))?1:0;let nazwa=NAZWY[wz]&&NAZWY[wz][f];
  if(wz==='PCC'){const rodz=byId(k[0].id);nazwa=kob(rodz)?(f?'siostrzenica':'siostrzeniec'):(f?'bratanica':'bratanek')}

function kimHtml(a,b){const r=kimJest(a,b);if(!r)return'<p class="empty">Te osoby nie są połączone powiązaniami rodzinnymi.</p>';

   ${r.kroki.length>1||!r.nazwa?`<p class="gen-l" style="margin:10px 0 6px">Droga w rodzinie</p><div class="kim-droga"><span>${h(A.imie)}</span>${r.kroki.map(k=>`<span class="kim-s">→ ${KROK[k.t][kob(byId(k.id))?1:0]}</span><button class="kim-n" data-go="${k.id}">${h(byId(k.id).imie)}</button>`).join('')}</div>`:''}`}
function osCzasu(ids,me){const z=ids.map(byId).filter(o=>rokUr(o)).sort((x,y)=>rokUr(x)-rokUr(y)),bez=ids.map(byId).filter(o=>!rokUr(o)),t=new Date().getFullYear();

    return `${naglowek}<button class="os-w ${o.id===me?'me':''}" data-go="${o.id}"><span class="os-r">${y}</span><span class="os-k"></span>${img(o)}<span class="grow"><b>${h(nazwa(o))}</b><br><small>${t-y} l.${rodzice(o.id).length?' · dziecko: '+rodzice(o.id).map(p=>h(byId(p).imie)).join(' i '):''}</small></span></button>`}).join('')}</div>
   ${bez.length?`<p class="gen-l" style="margin:14px 0 6px">Bez roku urodzenia</p><div class="stack" style="flex-wrap:wrap">${bez.map(o=>`<button class="node" data-go="${o.id}">${img(o)}${h(o.imie)}</button>`).join('')}</div>`:''}`}
function kolaz(ids,me){const dist={[me]:0},q=[me];while(q.length){const x=q.shift();sasiedzi(x).forEach(([y])=>{if(!(y in dist)){dist[y]=dist[x]+1;q.push(y)}})}
  const bliskosc=x=>(partnerzy(me).includes(x)?0:dist[x]??9);

  return `<div class="kolaz">${l.map((x,i)=>{const o=byId(x);return `<button class="kp kp-${rozm(x)}" style="--r:${((i*37)%9-4)*.7}deg" data-go="${x}">${wst(o)}${o.miniatura?`<img src="${o.miniatura}" alt="">`:`<div class="ph">${ini(o)}</div>`}<b>${h(o.imie)}</b></button>`}).join('')}</div>
   <p class="p-sub">Im bliżej ${h(byId(me).imie)}, tym większe zdjęcie.</p>`}

    if(pend.length){const n=await dodajRelacje(pend.map(p=>relDef(p.rel,os.id,p.id)));if(n)toast('Uzupełniono też powiązań: '+n)}
    zapiszCache();render();
    if(poZapisie)poZapisie(os);else{closeSheet();if(preset&&preset.po)setTimeout(preset.po,220);else if(!nowa)setTimeout(()=>przeladujOsobe(os.id),220)}};
}

/* ========= kadrowanie + kompresja 800x800 ========= */
function skaluj(c,max){ // zmniejszanie krokami po 50% — ostrzej niż jednym skokiem
  let w=c.width,hh=c.height;if(w<=max&&hh<=max)return c;const k=max/Math.max(w,hh),tw=Math.round(w*k),th=Math.round(hh*k);let cur=c;
  while(w/2>tw&&hh/2>th){w=Math.round(w/2);hh=Math.round(hh/2);const n=document.createElement('canvas');n.width=w;n.height=hh;const x=n.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cur,0,0,w,hh);cur=n}
  const o=document.createElement('canvas');o.width=tw;o.height=th;const x=o.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cur,0,0,tw,th);return o}
function kadruj(src,done){
  const d=openSheet(`<div class="bar"><button class="btn" data-x>Anuluj</button><button class="btn" data-rot>↻ Obróć</button><button class="btn pri" data-ok>Użyj</button></div>
   <div class="crop-wrap"><img data-img alt=""></div><p style="color:var(--muted);text-align:center">Przesuń i przybliż palcami, żeby twarz wypełniła kwadrat.</p>`);
  const im=d.querySelector('[data-img]');let cr;
  im.onload=()=>{cr=new Cropper(im,{aspectRatio:1,viewMode:1,dragMode:'move',autoCropArea:.85,background:false,guides:false})};im.src=src;
  d.querySelector('[data-x]').onclick=closeSheet;
  d.querySelector('[data-rot]').onclick=()=>cr&&cr.rotate(90);
  d.querySelector('[data-ok]').onclick=()=>{
    const src=cr.getCroppedCanvas({fillColor:'#fff'});          // wycinek w pełnej rozdzielczości oryginału
    const c=skaluj(src,800),full=c.toDataURL('image/jpeg',.9);
    const m=skaluj(c,320);let q=.82,mu=m.toDataURL('image/jpeg',q);while(mu.length>45000&&q>.4){q-=.08;mu=m.toDataURL('image/jpeg',q)}
    done(full,mu);closeSheet()};
}

/* ========= import z Google Kontaktów ========= */
async function importGoogle(){
  busy(true,'Pobieram listę kontaktów…');let k;
  try{k=(await api('googleLista')).kontakty}catch(e){busy(false);toast(e.message);return}busy(false);
  const sel=new Set();
  let bf=0,bl='';const d=openSheet(`<div class="bar"><button class="btn" data-x>← Wróć</button><button class="btn pri" data-go>Importuj (0)</button></div>
   <h1 class="p-name" style="text-align:left;font-size:26px">Google Kontakty</h1>
   ${(()=>{const e=[...new Set(k.flatMap(c=>c.etykiety||[]))].sort((a,b)=>a.localeCompare(b,'pl'));return e.length?`<p class="gen-l" style="margin:10px 0 0;text-align:left">Etykiety — dotknij, aby zaznaczyć wszystkie z etykiety</p><div class="chips" style="flex-wrap:wrap">${e.map(x=>`<button class="chip" data-et="${h(x)}">${h(x)} (${k.filter(c=>(c.etykiety||[]).includes(x)&&!c.juz).length})</button>`).join('')}</div>`:''})()}
   <input class="search" style="margin-top:12px" placeholder="Szukaj…" data-q><div data-list></div>`);
  d.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>{const x=b.dataset.et,on=!b.classList.contains('on');b.classList.toggle('on',on);k.forEach(c=>{if(!c.juz&&(c.etykiety||[]).includes(x))on?sel.add(c.rn):sel.delete(c.rn)});d.querySelector('[data-go]').textContent=`Importuj (${sel.size})`;lista()});
  const lista=()=>{const q=norm(d.querySelector('[data-q]').value);d.querySelector('[data-list]').innerHTML=k.filter(c=>!q||norm(c.nazwa+' '+c.tel).includes(q)).slice(0,300)
    .map(c=>`<label class="row check ${c.juz?'pick-row dis':''}" style="margin:0"><input type="checkbox" data-rn="${h(c.rn)}" ${sel.has(c.rn)?'checked':''} ${c.juz?'disabled':''}><div class="grow">${h(c.nazwa)}<br><small style="color:var(--muted)">${h(c.tel)}${c.maFoto?' 📷':''}${(c.etykiety||[]).length?' · '+c.etykiety.map(h).join(', '):''}${c.juz?' (już w bazie)':''}</small></div></label>`).join('');
    d.querySelectorAll('[data-rn]').forEach(i=>i.onchange=()=>{i.checked?sel.add(i.dataset.rn):sel.delete(i.dataset.rn);d.querySelector('[data-go]').textContent=`Importuj (${sel.size})`})};
  d.querySelector('[data-q]').oninput=lista;lista();
  d.querySelector('[data-x]').onclick=closeSheet;
  d.querySelector('[data-go]').onclick=async()=>{const rns=[...sel];if(!rns.length)return;let n=0;
    try{for(let i=0;i<rns.length;i+=25){busy(true,`Importuję ${i+1}–${Math.min(i+25,rns.length)} z ${rns.length}…`);const j=await api('googleImport',{rns:rns.slice(i,i+25)});S.osoby.push(...j.osoby);n+=j.osoby.length;if(j.bezFoto)bf+=j.bezFoto,bl=j.blad}
      zapiszCache();busy(false);toast('Zaimportowano: '+n+(bf?`. Bez zdjęcia: ${bf} (${bl})`:''));closeSheet();S.view='ludzie';render()}catch(e){busy(false);zapiszCache();toast('Przerwano po '+n+': '+e.message)}};
}
